# podcast-studio config schema
# New project initialization requires the channel name. Existing unnamed configs
# still load unchanged; add the real existing name explicitly when upgrading.
podcast:
  name: Your podcast name
  # english_name: Your English podcast name

# Copy to ~/.podcast-studio/config.yaml and edit the paths below.

# vault: where your podcast source notes and outputs live.
# `root` is the Obsidian/PKOS vault root — the base for recall and the directory
# contract (`<root>/99-System/10-Directory-Contract.md`). Optional: when unset, recall
# falls back to subjective_dir. The three *_dir keys are required and must exist on
# disk; the plugin fails-closed otherwise.
#
# Phase 4 output layout: output_dir is split into three DERIVED subdirs
# (auto-created, not YAML keys):
#   <output_dir>/episodes/  → {date}-{title}.md / .mp3 / {date}-{show}.stance.yaml
#   <output_dir>/state/     → covered-ground.yaml, character-bible.md, throughline.yaml
#   <output_dir>/reports/   → {date}-{show}.scorecard.md
# topic_log.yaml + source_log.jsonl + .scratch-* stay at output_dir root.
# This config file lives OUTSIDE output_dir (default ~/.podcast-studio/config.yaml).
vault:
  root: ~/Obsidian/PKOS                                # Obsidian/PKOS vault root (recall + directory contract)
  subjective_dir: ~/Obsidian/PKOS/30-Logs/30-Journal   # your subjective notes / journal
  news_dir: ~/Obsidian/PKOS/40-Inputs/News             # news / domain feed inputs
  output_dir: ~/Obsidian/PKOS/50-Outputs/podcast      # episodes/state/reports subdirs derived from here

# tts: which TTS provider + voice to use.
# Provider is "volc" (Volcengine / Doubao) or "minimax" (MiniMax).
# Voice must match the provider's voice catalog (see references/voice-catalog.md).
tts:
  provider: volc
  host_voice: BV001_streaming

  # vendor_priority (OPTIONAL) — the order synth-auto tries TTS vendors in.
  # The first one with enough quota synthesizes the WHOLE episode.
  # Known vendors: minimax, volc-2.0, volc-1.0, local
  #   local = the offline on-device engine (sherpa-onnx VITS-zh-ll). Costs
  #   nothing and cannot run out, but it is 16 kHz and its Chinese-only
  #   lexicon silently drops English words. Install it once with the tts
  #   skill's scripts/fetch-local-model.sh.
  # Omit this key → the skill's own default: minimax, volc-2.0, volc-1.0, local
  # ⛔ A name that is not in the list above is an ERROR, not a silent skip.
  # Examples:
  #   vendor_priority: [local, minimax]                 # stop spending money
  #   vendor_priority: [minimax, volc-2.0, volc-1.0]    # no offline fallback:
  #                                                     # an exhausted pool
  #                                                     # fails (exit 4) instead
  #                                                     # of shipping local audio
  # vendor_priority: [minimax, volc-2.0, volc-1.0, local]

  # local_voice (OPTIONAL) — which offline speaker the `local` vendor uses.
  # vits-zh-ll-sid0 … vits-zh-ll-sid4. Omit → sid0.
  # local_voice: vits-zh-ll-sid0

# TTS credentials are NOT stored in this file.
# Set VOLC_TTS_APPID + VOLC_TTS_TOKEN (Volcengine) or MINIMAX_API_KEY (MiniMax) in
# your shell env before running the tts scripts. The shim (lib/podcast-env.sh)
# re-exports provider/voice; your existing credential env is passed through unchanged.

# Optional service/language settings for THE SAME existing morning/evening pipeline.
# Original inputs, output_dir and continuity remain where vault.* specifies.
# Add these to your existing config after review, not to a separate profile.
# production:
#   provider: openai
#   language: en
#   model: gpt-4.1-mini-2025-04-14
#   speech_model: gpt-realtime-2.1-mini
#   voice: marin
#   source_authorized: false  # Set only after the owner approves the selected sources.
#   budget_ledger: EXISTING_VERIFIED_SHARED_LEDGER
#   budget_timezone: APPROVED_IANA_TIMEZONE
#   per_call_limit_usd: 0     # Replace with the actual approved cap; zero disables calls.
#   daily_limit_usd: 0

# English production defaults in the same section above (uncomment with it):
#   episode_kind: full  # demo must be explicit for short technical tests
#   min_minutes: 20
#   target_minutes: 25
#   max_minutes: 30
#   speaking_rate_wpm: 130
#   listening_level: b1-b2
#   max_average_sentence_words: 18
#   max_sentence_words: 32
#   speech_output_tokens: 1536  # per 80-word chunk; incomplete results stop
# Word ranges derive from minutes × pace (2600 / 3250 / 3900 by default).
# Do not copy a demo's 450 / 520 / 600-word limits into full production.
