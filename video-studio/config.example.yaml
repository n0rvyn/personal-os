# video-studio config example — 分层配置
#
# 配置分两层，分开存放：
#
# --- 机器级（~/.claude/video-studio/config.yaml） ---
# 机器相关设置（ffmpeg 路径、LLM 供应商、语音 ID、渲染参数、预算参数）
# 写一次，所有内容项目共用。
# 放在 ~/.claude/video-studio/config.yaml
#
# --- 内容级（项目 .video-studio/config.yaml） ---
# 每个内容项目独立的设置（输出目录、syllabus 路径、人物参考图、书系名）
# 放在各内容项目根目录的 .video-studio/config.yaml
#
# API credentials 放 shell env，不放这里：
#   Doubao/火山方舟: ARK_API_KEY
#   MiniMax:        MINIMAX_API_KEY  MINIMAX_GROUP_ID
#
# output_dir 必须在磁盘上先建好。video-studio 不会自动创建。

# =============================================================================
# 机器级（写到 ~/.claude/video-studio/config.yaml）
# =============================================================================

render:
  width: 1920
  height: 1080
  fps: 30
  subtitle_font: PingFang SC

audio:
  # MiniMax voice ID for TTS narration
  voice_id: male-qn-jingying-jingpin
  # BGM ducking attenuation in dB (how much to lower BGM under narration)
  bgm_duck_db: 18.0

media:
  # Image + video generation provider: "doubao" (default) or "minimax"
  provider: doubao

budget:
  # motion_value threshold: video beats >= this value are always kept (DP-001=C).
  # Beats below threshold are downgraded to still regardless of cap.
  video_motion_threshold: 0.6
  # Loose hard cap: backstop applied only after threshold gate.
  # Keeps the highest-motion videos if count still exceeds this limit.
  video_shots_per_episode: 8

ffmpeg:
  # Must be a libass-enabled build for subtitle burning.
  # Recommended static build: ~/.local/ffmpeg-libass/ffmpeg
  #   brew install ffmpeg does NOT include libass by default.
  #   Download libass-enabled static binary and point here.
  ffmpeg_bin: ~/.local/ffmpeg-libass/ffmpeg
  ffprobe_bin: ~/.local/ffmpeg-libass/ffprobe

# =============================================================================
# 内容级（写到 <内容项目>/.video-studio/config.yaml）
# =============================================================================

# Character reference image for subject-consistent video (Stage 0 artifact).
# Path to a portrait image of the on-screen character.
# Not existence-checked at config load time — OK if not yet generated.
character_ref: /path/to/character-ref.jpg

# Base output directory — MUST exist on disk before running.
# Subdirectories (episodes/, syllabus/, state/) are auto-created under it.
output_dir: /path/to/video-studio-output

# Syllabus and cursor paths (relative to content project root, or absolute).
# scaffold_content_project() fills these automatically.
syllabus_path: syllabus/runetic-training-science.yaml
cursor_path: syllabus/runetic-training-science_cursor.yaml

# Book series identifier (matches syllabus/source/<book>/ directory name).
book_series: runetic-training-science
